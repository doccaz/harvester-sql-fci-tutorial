# LIO targets for the SQL FCI lab: the three shared FCI LUNs (quorum, data, log). Sizes must stay distinct (step 09 finds the disks by size).
# helm upgrade --install lio-san lio/chart -f lio/values-fci.yaml \
#   --set namespace.name=lio-san --set nodeSelector."kubernetes\.io/hostname"=<NODE_A>
targets:
  - {name: fci-quorum,  iqn: "iqn.2024-01.com.example:fci-quorum",  device: /dev/iscsi-fci-quorum,  storage: 1Gi}
  - {name: fci-sqldata, iqn: "iqn.2024-01.com.example:fci-sqldata", device: /dev/iscsi-fci-sqldata, storage: 4Gi}
  - {name: fci-sqllog,  iqn: "iqn.2024-01.com.example:fci-sqllog",  device: /dev/iscsi-fci-sqllog,  storage: 2Gi}
storageClassName: harvester-2replicas
writeProtect: false
hostNetwork: true
